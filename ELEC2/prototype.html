<style>
:root{--bg:#0b1220;--p:#131d31;--p2:#1b2942;--b:#2a3a57;--t:#e8edf7;--m:#8b9ab5;--g:#22b865;--o:#f5a524;--r:#e5484d;--bl:#3b82f6}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--t);font:14px/1.45 "Segoe UI",system-ui,sans-serif}
nav{display:flex;align-items:center;gap:4px;padding:8px 22px;border-bottom:1px solid var(--b);position:sticky;top:0;background:#0b1220ee;backdrop-filter:blur(8px);z-index:5;flex-wrap:wrap}
nav>img{width:46px;height:46px;mix-blend-mode:lighten;animation:pop .8s}
.lg{font-size:22px;font-weight:700;margin:0 14px 0 4px}.lg b{color:var(--g)}
nav a{padding:7px 13px;border-radius:20px;color:var(--m);cursor:pointer;display:flex;gap:6px;align-items:center;transition:.2s}nav a:hover{color:var(--t)}nav a.on{background:var(--p2);color:var(--t)}
.sp{flex:1}
main{max-width:1200px;margin:auto;padding:22px;animation:in .35s}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes pop{from{transform:scale(.4) rotate(-90deg);opacity:0}}
@keyframes pu{50%{box-shadow:0 0 0 6px #22b86500;opacity:.5}}
@keyframes dr{to{stroke-dashoffset:0}}
.card{background:var(--p);border:1px solid var(--b);border-radius:12px;padding:16px}
h1{font-size:21px;margin-bottom:12px}h2{font-size:15px;margin-bottom:6px}
.g2{display:grid;grid-template-columns:270px 1fr;gap:18px;align-items:start}
.g3{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
.col3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.col4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.br2{display:grid;grid-template-columns:1fr 330px;gap:18px;align-items:start}
@media(max-width:900px){.g2,.br2,.col3,.col4{grid-template-columns:1fr!important}table{display:block;overflow-x:auto}.ph{margin:auto}}
@media(max-width:600px){main{padding:12px}nav{padding:6px 10px}nav a{padding:6px 9px}.lg{display:none}h1{font-size:18px}}
#dmo{position:fixed;right:18px;bottom:18px;width:320px;max-width:calc(100vw - 24px);background:var(--p);border:1px solid var(--g);border-radius:14px;padding:14px;z-index:40;box-shadow:0 10px 40px #000a;animation:in .35s;touch-action:none}.dh{display:flex;justify-content:space-between;cursor:grab;color:var(--g);font-weight:600;margin-bottom:8px}
.btn{border:1px solid var(--b);background:var(--p2);color:var(--t);padding:8px 14px;border-radius:8px;cursor:pointer;font:inherit;transition:.15s}.btn:hover{filter:brightness(1.25);transform:translateY(-1px)}.btn:disabled{cursor:not-allowed}
.bg{background:var(--g);border-color:var(--g);color:#04210f;font-weight:600}.br{background:var(--r);border-color:var(--r)}.bo{background:#3a2a0a;border-color:var(--o);color:var(--o)}.bb{background:var(--bl);border-color:var(--bl)}.bx{background:none;border-color:var(--r);color:var(--r)}
.pill{display:inline-block;padding:1px 10px;border-radius:12px;font-size:12px;border:1px solid var(--b);background:var(--p2)}
.Like{color:#4ade80;border-color:#4ade80}.Good{color:var(--g);border-color:var(--g)}.Fair{color:var(--o);border-color:var(--o)}.Poor{color:#fb923c;border-color:#fb923c}.For{color:var(--r);border-color:var(--r)}.bl{color:var(--bl);border-color:var(--bl)}
.m{color:var(--m)}.lk{color:var(--bl);cursor:pointer;text-decoration:underline}
.row{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid var(--b);gap:8px}
.tp{width:100%;aspect-ratio:4/3;object-fit:contain;border-radius:8px;background:#fff;display:block}
.th{width:62px;height:46px;object-fit:contain;border-radius:6px;background:#fff;display:inline-grid;place-items:center;color:#222}.th.l{width:70px;height:54px}
.av{width:30px;height:30px;border-radius:50%;object-fit:cover;vertical-align:middle}.av.l{width:54px;height:54px}
.cd{cursor:pointer;transition:.2s}.cd:hover,.cd.sel{border-color:var(--bl);transform:translateY(-3px)}.cd.sel{background:#14304a}
input,select,textarea{width:100%;background:var(--bg);border:1px solid var(--b);color:var(--t);padding:9px;border-radius:8px;font:inherit;margin:4px 0 10px}
label{color:var(--m);font-size:13px}
.warn{background:#2d2010;border:1px solid var(--o);border-radius:10px;padding:14px;display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-top:16px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--g);display:inline-block;animation:pu 1.6s infinite}
.pb{height:7px;background:var(--p2);border-radius:5px;overflow:hidden;margin:4px 0 10px}.pb i{display:block;height:100%;background:var(--g);width:0;transition:width 1s}
.chip{padding:6px 14px;border-radius:20px;border:1px solid var(--b);cursor:pointer;background:var(--p2);transition:.2s}.chip.on{background:var(--g);color:#04210f;border-color:var(--g)}
.ph{width:246px;min-height:500px;border:6px solid #25324d;border-radius:30px;background:var(--bg);padding:14px;transition:.4s;opacity:.3;pointer-events:none;display:flex;flex-direction:column;gap:8px}.ph.on{opacity:1;pointer-events:auto;transform:scale(1.03);box-shadow:0 0 34px #22b86533}
.code{font-size:34px;font-weight:700;letter-spacing:4px;text-align:center;margin:10px 0}
canvas{background:#0e1626;border:1px solid var(--b);border-radius:8px;touch-action:none;width:200px;height:70px}
.tl{border-left:2px solid var(--b);padding-left:14px;margin-left:6px}.tl .card{margin-bottom:10px;animation:in .4s}.tl .cur{border-color:var(--bl)}
.step{display:flex;gap:6px;align-items:center;margin-bottom:14px;flex-wrap:wrap}.step span{padding:3px 12px;border-radius:14px;background:var(--p2);color:var(--m)}.step .d{color:var(--g)}.step .c{background:var(--g);color:#04210f;font-weight:600}
table{width:100%;border-collapse:collapse}td,th{padding:8px;text-align:left;border-bottom:1px solid var(--b)}th{color:var(--m);font-weight:500}
.bar{height:26px;background:var(--bl);border-radius:5px;width:0;transition:width 1.2s;display:flex;align-items:center;justify-content:flex-end;padding-right:8px;font-size:12px}
.ms{display:block;max-width:75%;padding:8px 12px;border-radius:12px;background:var(--p2);margin:6px 0;animation:in .3s}.ms.me{margin-left:auto}
.ln{fill:none;stroke-width:2.5;stroke-dasharray:700;stroke-dashoffset:700;animation:dr 2s forwards}
.rt button{width:36px;height:36px;border-radius:50%;border:1px solid var(--b);background:var(--p2);color:var(--t);margin-left:6px;cursor:pointer;transition:.2s}.rt button.on{border-color:var(--g);color:var(--g);background:#0f2a1c;transform:scale(1.15)}
#md{position:fixed;inset:0;display:none;place-items:center;background:#000b;z-index:20}#md.s{display:grid}#md>.card{animation:in .3s;max-height:92vh;overflow:auto}
#dr{position:fixed;top:0;right:-390px;width:370px;height:100%;background:var(--p);border-left:1px solid var(--b);z-index:15;transition:.35s;padding:18px;overflow:auto}#dr.s{right:0}
#ts{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:30;display:grid;gap:6px}.t{background:#0f2a1c;border:1px solid var(--g);padding:10px 18px;border-radius:10px;animation:in .3s}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
