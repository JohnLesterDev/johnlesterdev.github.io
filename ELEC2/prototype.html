<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>ITSwap Prototype</title>
<style>
:root{--bg:#0b1220;--p:#131d31;--p2:#1b2942;--b:#2a3a57;--t:#e8edf7;--m:#8b9ab5;--g:#22b865;--o:#f5a524;--r:#e5484d;--bl:#3b82f6}
*{box-sizing:border-box;margin:0}
html{overflow-y:scroll;scrollbar-gutter:stable both-edges}
html,body{max-width:100vw;overflow-x:clip}
body{background:var(--bg);color:var(--t);font:14px/1.45 "Segoe UI",system-ui,sans-serif}
nav{display:flex;align-items:center;gap:4px;padding:8px 18px;border-bottom:1px solid var(--b);position:sticky;top:0;background:#0b1220ee;backdrop-filter:blur(8px);z-index:5;flex-wrap:wrap;min-height:60px}
nav>img{width:42px;height:42px;object-fit:contain;flex:none}
.lg{font-size:20px;font-weight:700;margin:0 12px 0 2px;flex:none}.lg b{color:var(--g)}
nav a{padding:6px 11px;border-radius:20px;color:var(--m);cursor:pointer;display:inline-flex;gap:6px;align-items:center;transition:.2s;white-space:nowrap;font-size:13px}
nav a:hover{color:var(--t)}nav a.on{background:var(--p2);color:var(--t)}
nav a svg{flex:none}
.sp{flex:1}
main{max-width:1200px;margin:auto;padding:18px;animation:in .3s}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes dr{to{stroke-dashoffset:0}}
.card{background:var(--p);border:1px solid var(--b);border-radius:12px;padding:14px;min-width:0;overflow-wrap:anywhere}
h1{font-size:20px;margin-bottom:10px}h2{font-size:14px;margin-bottom:6px}
.g2{display:grid;grid-template-columns:260px minmax(0,1fr);gap:16px;align-items:start}
.g3{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.col3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.col4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.br2{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:16px;align-items:start}
.g2>*,.g3>*,.col3>*,.col4>*,.br2>*{min-width:0}
@media(max-width:900px){.g2,.br2,.col3,.col4{grid-template-columns:1fr!important}table{display:block;overflow-x:auto}.ph{margin:auto}}
@media(max-width:640px){
  main{padding:10px;padding-bottom:30px}
  nav{padding:6px 8px;gap:2px}
  nav a{padding:5px 8px;font-size:12px}
  .lg{display:none}
  h1{font-size:17px}
  .g2,.br2,.col3,.col4{grid-template-columns:1fr!important}
  #dmo{width:100%!important;right:0!important;bottom:0!important;left:0!important;border-radius:12px 12px 0 0!important;max-width:none!important;max-height:46vh!important}
}
.btn{border:1px solid var(--b);background:var(--p2);color:var(--t);padding:7px 13px;border-radius:8px;cursor:pointer;font:inherit;font-size:13px;transition:.15s;white-space:nowrap;display:inline-flex;align-items:center;gap:6px;justify-content:center}
.btn:hover:not(:disabled){filter:brightness(1.25)}
.btn:disabled{cursor:not-allowed;opacity:.45}
.bg{background:var(--g);border-color:var(--g);color:#04210f;font-weight:600}
.br{background:var(--r);border-color:var(--r);color:#fff}
.bo{background:#3a2a0a;border-color:var(--o);color:var(--o)}
.bb{background:var(--bl);border-color:var(--bl);color:#fff}
.bx{background:none;border-color:var(--r);color:var(--r)}
.pill{display:inline-flex;align-items:center;gap:4px;padding:1px 9px;border-radius:12px;font-size:11px;border:1px solid var(--b);background:var(--p2);white-space:nowrap;line-height:1.6}
.Like{color:#4ade80;border-color:#4ade80}.Good{color:var(--g);border-color:var(--g)}.Fair{color:var(--o);border-color:var(--o)}.Poor{color:#fb923c;border-color:#fb923c}.For{color:var(--r);border-color:var(--r)}.bl{color:var(--bl);border-color:var(--bl)}
.m{color:var(--m)}.lk{color:var(--bl);cursor:pointer;text-decoration:underline}
.row{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid var(--b);gap:8px;min-width:0}
.tp{width:100%;aspect-ratio:4/3;object-fit:contain;border-radius:8px;background:#fff;display:block}
.th{width:56px;height:42px;object-fit:contain;border-radius:6px;background:#fff;display:inline-flex;align-items:center;justify-content:center;color:#222;flex:none}
.th.l{width:64px;height:48px}
.av{width:28px;height:28px;border-radius:50%;object-fit:cover;vertical-align:middle;flex:none;background:#25324d}
.av.l{width:52px;height:52px}
.cd{cursor:pointer;transition:.2s}.cd:hover,.cd.sel{border-color:var(--bl)}
.cd.sel{background:#14304a}
input,select,textarea{width:100%;background:var(--bg);border:1px solid var(--b);color:var(--t);padding:8px;border-radius:8px;font:inherit;font-size:13px;margin:4px 0 10px;min-width:0}
input[type=checkbox]{width:auto;margin:0 6px 0 0}
label{color:var(--m);font-size:12px;display:block}
.warn{background:#2d2010;border:1px solid var(--o);border-radius:10px;padding:12px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:14px}
.warn>div{flex:1;min-width:200px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--g);display:inline-block}
.pb{height:6px;background:var(--p2);border-radius:5px;overflow:hidden;margin:4px 0 8px}
.pb i{display:block;height:100%;background:var(--g);width:0;transition:width 1s}
.chip{padding:5px 12px;border-radius:20px;border:1px solid var(--b);cursor:pointer;background:var(--p2);transition:.2s;white-space:nowrap;font-size:12px;display:inline-flex;align-items:center;gap:4px}
.chip.on{background:var(--g);color:#04210f;border-color:var(--g)}
.ph{width:240px;min-height:480px;border:6px solid #25324d;border-radius:28px;background:var(--bg);padding:12px;transition:.4s;opacity:.3;pointer-events:none;display:flex;flex-direction:column;gap:8px}
.ph.on{opacity:1;pointer-events:auto;transform:scale(1.02);box-shadow:0 0 30px #22b86533}
.code{font-size:30px;font-weight:700;letter-spacing:3px;text-align:center;margin:8px 0;font-family:monospace}
canvas{background:#0e1626;border:1px solid var(--b);border-radius:8px;touch-action:none;width:180px;height:60px}
.tl{border-left:2px solid var(--b);padding-left:12px;margin-left:4px}
.tl .card{margin-bottom:8px}.tl .cur{border-color:var(--bl)}
.step{display:flex;gap:5px;align-items:center;margin-bottom:12px;flex-wrap:wrap;font-size:12px}
.step span{padding:3px 10px;border-radius:14px;background:var(--p2);color:var(--m);white-space:nowrap}
.step .d{color:var(--g)}.step .c{background:var(--g);color:#04210f;font-weight:600}
table{width:100%;border-collapse:collapse;font-size:13px}
td,th{padding:7px;text-align:left;border-bottom:1px solid var(--b)}
th{color:var(--m);font-weight:500}
.bar{height:22px;background:var(--bl);border-radius:5px;width:0;transition:width 1.2s;display:flex;align-items:center;justify-content:flex-end;padding-right:6px;font-size:11px}
.ms{display:block;max-width:80%;padding:7px 11px;border-radius:10px;background:var(--p2);margin:5px 0;white-space:pre-wrap;word-break:break-word;font-size:13px}
.ms.me{margin-left:auto;background:#14304a}
.ln{fill:none;stroke-width:2.5;stroke-dasharray:700;stroke-dashoffset:700;animation:dr 2s forwards}
.rt{display:flex;gap:4px;flex-wrap:wrap}
.rt button{width:32px;height:32px;border-radius:50%;border:1px solid var(--b);background:var(--p2);color:var(--t);cursor:pointer;transition:.2s;font-size:12px}
.rt button.on{border-color:var(--g);color:var(--g);background:#0f2a1c}
#md{position:fixed;inset:0;display:none;place-items:center;background:#000b;z-index:500;padding:16px}
#md.s{display:grid}
#md>.card{animation:in .3s;max-height:calc(100vh - 32px);overflow:auto;max-width:640px;width:100%}
#dr{position:fixed;top:0;right:-380px;width:360px;max-width:100vw;height:100%;background:var(--p);border-left:1px solid var(--b);z-index:150;transition:.3s;padding:16px;overflow:auto}
#dr.s{right:0}
#ts{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);z-index:1600;display:grid;gap:5px;pointer-events:none;max-width:calc(100vw - 20px)}
.t{background:#0f2a1c;border:1px solid var(--g);padding:9px 16px;border-radius:10px;animation:in .3s;font-size:13px}
#ch{height:300px;overflow-y:auto;padding-right:6px;scroll-behavior:smooth;border:1px solid var(--b);border-radius:8px;padding:8px;background:#0e1626}
#ch::-webkit-scrollbar{width:6px}
#ch::-webkit-scrollbar-thumb{background:var(--b);border-radius:3px}
.sidebar-sticky{position:sticky;top:74px;max-height:calc(100vh - 92px);overflow-y:auto;padding-right:4px}
.sidebar-sticky::-webkit-scrollbar{width:6px}
.sidebar-sticky::-webkit-scrollbar-thumb{background:var(--b);border-radius:3px}
.hl{box-shadow:inset 0 0 0 3px var(--bl);border-radius:10px;position:relative;z-index:10;scroll-margin-top:90px;scroll-margin-bottom:220px}
#dmo{position:fixed;right:14px;bottom:14px;width:330px;max-width:calc(100vw - 20px);background:var(--p);border:1px solid var(--g);border-radius:12px;padding:12px;z-index:2000;box-shadow:0 8px 32px #000a;max-height:calc(100vh - 28px);display:flex;flex-direction:column;overflow:hidden}
#dmo.guide{border-color:var(--bl)}
#dmo.min .dbody,#dmo.min .pb{display:none}
#dmo .dh{display:flex;justify-content:space-between;color:var(--g);font-weight:600;margin-bottom:6px;flex:none;font-size:13px;align-items:center;gap:6px}
#dmo.guide .dh{color:var(--bl)}
#dmo .dbody{overflow-y:auto;flex:1;min-height:0;font-size:13px}
#dmo .dh .dhicons{display:flex;gap:2px;flex:none}
#dmo .dh .dhicons span{cursor:pointer;padding:2px 6px;border-radius:4px;display:inline-flex;align-items:center}
#dmo .dh .dhicons span:hover{background:#ffffff10}
.greq{font-size:12px;margin:8px 0;padding:7px 10px;border-radius:8px;background:#1b2942;border-left:3px solid var(--o);color:var(--o);display:flex;align-items:center;gap:6px}
.greq svg{flex:none}
.upbox{border:1.5px dashed var(--b);border-radius:10px;padding:20px;text-align:center;color:var(--m);cursor:pointer;transition:.2s;background:none;font:inherit;display:block;width:100%}
.upbox:hover{border-color:var(--bl);color:var(--t)}
.icn{display:inline-flex;align-items:center;gap:6px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body><nav id="nav"></nav><main id="app"></main><div id="md" onclick="if(event.target===this)cl()"></div><div id="dr"></div><div id="ts"></div>

R.prop=()=>{const n=S.tl.length-1;return`<div style="max-width:720px;margin:auto"><div class="card"><h1>Create Proposal</h1><p class="m" style="margin-bottom:8px;font-size:13px">Trade target: <b style="color:var(--t)">${S.rq[0]||'(pick from Browse)'}</b></p><div class="col3" style="grid-template-columns:1fr 1fr"><div><label>You offer</label>${S.of.length?S.of.map(i=>`<div class="card" style="margin:5px 0;padding:8px;font-size:12px"><span class="icn">${sv('box',13)} ${i}</span></div>`).join(''):'<p class="m" style="padding:6px 0;font-size:12px">Nothing added yet</p>'}<button id="btn-add-offer" class="btn" style="width:100%" onclick="GUIDE.offerAddClicked=true; ai('of')">${sv('plus')} Add items</button></div><div><label>You request</label>${S.rq.length?S.rq.map(i=>`<div class="card" style="margin:5px 0;padding:8px;font-size:12px"><span class="icn">${sv('save',13)} ${i}</span></div>`).join(''):'<p class="m" style="padding:6px 0;font-size:12px">Nothing added yet</p>'}<button id="btn-add-req" class="btn" style="width:100%" onclick="GUIDE.reqAddClicked=true; ai('rq')">${sv('plus')} Add items</button></div></div><label style="display:block;margin-top:10px">Offer note</label><textarea id="on" rows="2" placeholder="Add a structured note..." oninput="GUIDE.noteWritten=this.value.trim().length>0"></textarea><div style="text-align:right"><button class="btn bg" id="guide-send" onclick="sp()">Send Proposal</button></div></div><h1 style="margin:16px 0 10px">Negotiation Timeline</h1><div class="tl">${S.tl.length?S.tl.map((v,i)=>`<div class="card ${i===n?'cur':''}"><b style="font-size:13px">v${i+1} · ${v[0]}</b><br><span class="m" style="font-size:12px">Offered: ${v[1]}<br>Requested: ${v[2]}</span><br><span style="font-size:12px">${v[3]}</span>${i===n?`<div style="margin-top:8px;display:flex;gap:6px;flex-wrap:wrap"><button id="btn-accept" class="btn bg" onclick="ac()">Accept</button><button id="btn-counter" class="btn" onclick="cn()">Counter</button><button class="btn bx" id="btn-decline" onclick="T('Proposal declined')">Decline</button></div>`:''}</div>`).join(''):'<p class="m">No versions yet. Send your first proposal above.</p>'}</div></div>`};

function ai(k){const src=(k==='of'?MY.filter(x=>x[6]==='Active').map(x=>[x[0],x[3],x[4]]):IT.map(x=>[x[0],x[3],x[4]])).filter(x=>!S[k].includes(x[0]));if(!src.length)return T('Nothing more to add here');MD(`<div class="card" style="width:440px;max-width:92vw"><div class="row" style="border:0"><h1>Add to ${k==='of'?'your offer':'your request'}</h1><button class="btn" onclick="cl()">${sv('x')}</button></div>${src.map(x=>`<div class="card cd" style="margin-bottom:6px;display:flex;gap:10px;align-items:center" onclick="aiPick('${k}','${x[0].replace(/'/g,"\\'")}')">${im(x[1],x[2],'th')} <b style="font-size:13px">${x[0]}</b></div>`).join('')}</div>`)}
function aiPick(k,n){S[k].push(n); cl(); render(); T('Item added to '+k)}
function sp(){if(!S.of.length||!S.rq.length)return T('Add at least one item to both sides first');const note=($('#on')&&$('#on').value)||'No note added.';S.tl.push([S.tl.length?'Counter-Proposal':'Initial Proposal',S.of.join(' + '),S.rq.join(' + '),note]);GUIDE.propSent=true;T('Proposal sent · v'+S.tl.length);render()}
function cn(){if(!S.of.length||!S.rq.length)return T('Both sides need items');S.tl.push(['Counter-Proposal',S.of.join(' + '),S.rq.join(' + '),($('#on')&&$('#on').value)||'Counter-offer update.']);GUIDE.counterSent=true;T('Counter sent · v'+S.tl.length);render()}
function ac(){S.synced=0;S.stage='Accepted';S.unlock=true;GUIDE.accepted=true;T('Trade accepted. Messaging unlocked.');render()}

/* ═══════════ Trades ═══════════ */
R.trades=()=>{const tc=`<div class="card" style="border-color:var(--g);background:var(--bg)"><h2 style="font-size:13px">Trade #T-198</h2><div style="margin-bottom:4px;font-size:12px">${av(33)} Alex R. <span class="pill Good" style="font-size:10px">Verified</span></div><p class="m" style="font-size:11px">Trade info</p><p style="font-size:12px">Give: ${S.of.join(', ')||'Corsair Vengeance 16GB DDR4'}<br><span style="display:inline-block;margin:2px 0">${sv('swap',12)}</span><br>Get: ${S.rq.join(', ')||'Samsung 1TB SSD'}</p><p class="m" style="margin-top:5px;font-size:11px">Scheduling info</p><p style="font-size:12px"><span class="icn">${sv('pin',12)}</span> Library – 2nd Floor Lobby<br><span class="icn">${sv('cal',12)}</span> ${DS_DATES[0]}, 2:00 PM <span class="pill Fair" style="font-size:10px">${sv('clock',10)} 2h</span></p><div style="display:grid;gap:5px;margin-top:8px"><button class="btn" id="btn-manifest" onclick="vm()">View Manifest</button><button id="btn-meet" class="btn" onclick="go('meet')">Meetup &amp; chat</button><button class="btn bx" onclick="xc('cancel')">Cancel trade</button><button class="btn bx" onclick="xc('ns')">Simulate no-show</button></div></div>`;return`<div class="g2">${pr()}<div><div class="row" style="border:0;flex-wrap:wrap"><h1>MY TRADES PIPELINE</h1><span style="font-size:12px"><span class="dot"></span> Sync active · <span class="lk" onclick="go('arch')">History &amp; archive</span></span></div><div class="col4">${['Proposed','Accepted','Scheduled','Finalized'].map(s=>`<div class="card"><h2 style="font-size:12px">${s} <span class="m">(${S.stage===s?1:0})</span></h2>${S.stage===s?tc:'<p class="m" style="font-size:12px">No active proposals</p>'}</div>`).join('')}</div></div></div>${bn()}`};

/* ═══════════ Meetup ═══════════ */
const msgs=()=>S.msgs.map(m=>`<span class="ms ${m[0]==='m'?'me':''}">${m[1]}</span>`).join('');
R.meet=()=>`<div class="col3" style="grid-template-columns:1fr 1.3fr"><div class="card"><h1 style="font-size:16px">Propose Meetup</h1><p class="m" style="font-size:12px">Trade #T-198</p><label>Location</label><select id="loc"><option>Library – 2nd Floor Lobby</option><option>Engineering Bldg – Rm 204 Lounge</option><option>Student Center – Food Court</option></select><label>Date</label><select id="dt">${DS_DATES.map(d=>`<option>${d}</option>`).join('')}</select><label>Time</label><input type="time" id="tm" value="14:00"><p class="m" style="margin-bottom:8px;font-size:11px">8AM–5PM only, monitored campus grounds</p><p style="margin-bottom:10px;font-size:12px"><span class="pill Good">You: Confirmed ${sv('check',10)}</span> <span class="pill Fair" id="pt">Partner: Pending</span></p><button class="btn bg" style="width:100%" id="guide-meet-confirm" onclick="cm()">Confirm Meetup</button></div><div class="card" style="min-width:0"><h1 style="font-size:16px">Trade #T-198 · Alex R.</h1><div class="warn" style="margin:0 0 8px;padding:8px;font-size:12px">${sv('lock',12)} Unlocked for accepted trade. Messages lock upon finalization.</div><div id="ch">${msgs()}</div><div style="display:flex;gap:6px;align-items:stretch;margin-top:8px"><input id="mi" placeholder="Write a message..." onkeydown="event.key==='Enter'&&sm()" style="margin:0"><button class="btn bg" style="flex:none" onclick="sm()">Send</button></div><p class="m" style="margin-top:6px;font-size:11px">${sv('lock',10)} Only available while in Accepted or Scheduled state</p></div></div>`;
function sm(){const v=$('#mi').value.trim();if(!v)return;S.msgs.push(['m',v]);$('#ch').innerHTML=msgs();$('#ch').scrollTop=$('#ch').scrollHeight;$('#mi').value='';setTimeout(()=>{S.msgs.push(['p',['Sounds good!','See you there','Bringing the box and a screwdriver.'][S.msgs.length%3]]);if($('#ch')){$('#ch').innerHTML=msgs();$('#ch').scrollTop=$('#ch').scrollHeight}},1200)}
function cm(){const t=$('#tm').value;if(t<'08:00'||t>'17:00')return T('Meetups are limited to 8AM–5PM on monitored campus grounds');const p=$('#pt');if(p){p.innerHTML='Partner: Confirmed '+sv('check',10);p.className='pill Good';S.stage='Scheduled'}GUIDE.meetConfirmed=true;T('Meetup confirmed for '+$('#dt').value+' at '+t)}

/* ═══════════ Listings ═══════════ */
R.list=()=>{const m=MY,cd=x=>`<div class="card" style="margin-bottom:8px;display:flex;gap:10px"><div style="flex:none">${im(x[3],x[4],'th l')}</div><div style="min-width:0"><b style="font-size:13px">${x[0]}</b> <span class="pill ${gc(x[2])}">${x[2]}</span><br><span class="m" style="font-size:11px">${x[1]}</span><br>${x[5]?`<span class="pill Fair" style="font-size:10px">${x[5]} active proposals</span>`:'<span class="m" style="font-size:11px">No proposals yet</span>'}</div></div>`;
const rows=m.filter(x=>S.tab==='All'||x[6]===S.tab);return`<div class="g2">${pr()}<div><div class="row" style="border:0;flex-wrap:wrap"><h1>MY LISTINGS</h1><span style="display:flex;gap:6px;flex-wrap:wrap"><button class="btn" onclick="S.view=S.view==='c'?'t':'c';render()">${S.view==='c'?sv('table')+' Table':sv('grid')+' Cards'}</button> <button class="btn bg" onclick="go('new')">${sv('plus')} List New Item</button></span></div>${S.view==='c'?`<div class="col3">${['Active','Traded','Removed'].map(s=>`<div class="card"><h2 style="font-size:12px">${s} (${m.filter(x=>x[6]===s).length})</h2>${m.filter(x=>x[6]===s).map(cd).join('')||'<p class="m" style="font-size:12px">No listings</p>'}</div>`).join('')}</div>`:`<div style="display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap">${['All','Active','Traded','Removed'].map(t=>`<span class="chip ${S.tab===t?'on':''}" onclick="S.tab='${t}';render()">${t} (${t==='All'?m.length:m.filter(x=>x[6]===t).length})</span>`).join('')}</div><div class="card"><table><tr><th>Item</th><th>Category</th><th>Condition</th><th>Proposals</th><th>Listed</th><th></th></tr>${rows.map(x=>`<tr><td><div style="display:flex;gap:6px;align-items:center">${im(x[3],x[4],'th')} ${x[0]}</div></td><td>${x[1]}</td><td><span class="pill ${gc(x[2])}">${x[2]}</span></td><td><span class="pill ${x[5]?'Fair':''}">${x[5]}</span></td><td>${x[7]}</td><td><button class="btn" style="padding:3px 8px" onclick="T('Edit ${x[0]}')">${sv('dots')}</button></td></tr>`).join('')}</table></div>`}</div></div>${bn()}`};

R.new=()=>{const w=S.wz,s=S.ws,st=['Category','Specifications','Condition','Media','Review'];
const B=[()=>CATS.slice(1).map(c=>`<div class="card cd ${w.c===c?'sel':''}" style="margin-bottom:6px;padding:10px" onclick="S.wz.c='${c}';render()">${c}</div>`).join(''),
()=>`<label>Name</label><input value="${w.n}" oninput="S.wz.n=this.value"><label>Interface</label><input value="${w.i}" oninput="S.wz.i=this.value"><label>Capacity</label><input value="${w.cp}" oninput="S.wz.cp=this.value">`,
()=>`<p class="m" style="margin-bottom:8px;font-size:12px">Select the grade that fits your hardware.</p><div class="col3" style="grid-template-columns:1fr 1fr">${[['Like New','No visible wear, fully functional.'],['Good','Minor wear, fully functional.'],['Fair','Visible wear, functional.'],['Poor','Significant wear, functional with caveats.'],['For Parts','Not fully functional or untested.']].map(([g,d])=>`<div class="card cd ${w.g===g?'sel':''}" onclick="S.wz.g='${g}';render()" style="padding:10px"><b style="font-size:12px">${w.g===g?'&bull; ':'&#9675; '}${g}</b><br><span class="m" style="font-size:11px">${d}</span></div>`).join('')}</div>`,
()=>`<p class="m" style="margin-bottom:8px;font-size:12px">Three photo angles and a short functional video are required.</p><div class="col4">${['Front','Back','Ports','Video'].map((n,i)=>`<div class="card cd ${w.m[i]?'sel':''}" style="text-align:center;height:80px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:12px" onclick="S.wz.m[${i}]^=1;render()">${w.m[i]?sv('check',16,'var(--g)'):sv('plus',16,'var(--m)')}<br>${n}</div>`).join('')}</div>`,
()=>`<h2 style="font-size:14px">${w.n}</h2><p style="font-size:13px">${w.c} · ${w.i} · ${w.cp} · <span class="pill ${gc(w.g)}">${w.g}</span></p><p class="m" style="font-size:12px">Media: ${w.m.filter(Boolean).length}/4 uploaded</p>`];
return`<h1>List New Item</h1><div class="card"><div class="step">${st.map((t,i)=>`<span class="${i+1<s?'d':i+1===s?'c':''}">${i+1<s?sv('check',10)+' ':''}${i+1}.${t}</span>`).join('')}</div><div class="g2"><div class="card"><h2 style="font-size:12px">Draft info</h2><p class="m" style="font-size:12px">Category: ${w.c}<br>Name: ${w.n}<br>Interface: ${w.i}<br>Capacity: ${w.cp}<br>Condition: ${w.g}</p></div><div><h2 style="margin-bottom:10px;font-size:14px">${s}. ${['Select category','Specifications','Select item condition','Upload media','Review &amp; publish'][s-1]}</h2>${B[s-1]()}<div class="row" style="border:0;margin-top:12px"><button class="btn" onclick="S.ws>1?(S.ws--,render()):go('list')">Back</button><button class="btn bg" onclick="nx()">${s===5?'Publish listing':'Next: '+st[s]}</button></div></div></div></div>`};

function nx(){const w=S.wz;if(S.ws===4&&w.m.some(x=>!x))return T('Add three photos and a short video first');if(S.ws===5){MY.unshift([w.n,w.c,w.g,'computer,hardware',30,0,'Active','Today']);S.ws=1;T('Listing published');return go('list')}S.ws++;render()}

/* ═══════════ Archive ═══════════ */
R.arch=()=>`<p class="m" style="font-size:12px">My trades › History &amp; archive</p><h1>Terminal pipeline states</h1><div class="col3" style="grid-template-columns:1fr 1fr"><div class="card"><div class="row"><h2 style="font-size:13px">Trade #T-142 · Corsair Vengeance RAM</h2><span class="pill For">CANCELLED</span></div><p style="margin:8px 0"><span class="pill For">Cancelled by lister</span> <span class="m" style="font-size:11px">Auto-expired: no-show</span></p><div class="warn" style="margin:0 0 8px;padding:8px;font-size:12px">${sv('warn',12,'var(--o)')} This cancellation has been recorded on your trust profile.</div><p class="m" style="font-size:12px">Reason: "Lister decided not to proceed after scheduled meetup delay."</p><button class="btn bg" onclick="T('Listing re-activated')">Re-activate Listing</button></div><div class="card"><div class="row"><h2 style="font-size:13px">Trade #T-198 · Samsung SSD</h2><span class="pill bl">${sv('lock',10)} FINALIZED</span></div><div class="warn" style="margin:8px 0;padding:8px;font-size:12px">${sv('lock',12)} Messaging permanently locked.</div><p class="m" style="font-size:11px">Hash: ${S.hash||'a3f9e…2b4d'}</p><div class="card" style="margin:8px 0;font-size:12px"><span class="icn">${sv('check',12,'var(--g)')} Item matches listing photos</span><br><span class="icn">${sv('check',12,'var(--g)')} Condition matches declared grade</span><br><span class="icn">${sv('check',12,'var(--g)')} All accessories present</span></div><div class="col3" style="grid-template-columns:1fr 1fr"><div class="card" style="text-align:center;font:italic 18px Georgia">Alex R.</div><div class="card" style="text-align:center;font:italic 18px Georgia">Juan Dela Cruz</div></div><button class="btn" style="margin-top:8px" onclick="T('Preparing agreement PDF…')">Export / Print Agreement (PDF)</button></div></div>`;

/* ═══════════ Handoff flow ═══════════ */
function prep(){GUIDE.prepStarted=true;const L=['Service worker caching','Local key generation','TOTP secret staging'];MD(`<div class="card" style="width:440px;max-width:92vw"><h1>${sv('shield',18)} Prepare for Offline Handoff</h1><p class="m" style="margin-bottom:8px;font-size:12px">Cache your manifest and cryptographic keys while connected to campus Wi-Fi.</p>${L.map((t,i)=>`<div id="pl${i}" style="font-size:12px">${sv('clock',12)}${t}</div><div class="pb"><i id="pb${i}"></i></div>`).join('')}<p class="m" style="margin-bottom:10px;font-size:12px">Your device is primed for offline verification.</p><div class="row" style="border:0;flex-wrap:wrap"><button class="btn" onclick="cl()">Back</button><button class="btn bg" id="rd" onclick="goOffline()">${sv('lock',12)} I'm Ready to Go Offline</button></div></div>`);L.forEach((t,i)=>{setTimeout(()=>{const p=$('#pb'+i);if(p)p.style.width='100%'},200+i*800);setTimeout(()=>{const p=$('#pl'+i);if(p)p.innerHTML=sv('check',12,'var(--g)')+' '+t+(i===0?' — complete (4.2 MB)':' — complete')},1000+i*800)})}
function goOffline(){GUIDE.prepDone=true;S.step=1;GUIDE.stepTp=tp();cl();go('hand')}
function vm(){GUIDE.manifestViewed=true;MD(`<div class="card" style="width:400px;max-width:92vw"><h1>Trade #T-198 Manifest</h1><p class="m" style="font-size:12px">Confirmed physical assessments:</p><p style="margin:8px 0;font-size:12px">${['Item matches listing photos','Condition matches declared grade','All accessories present'].map(x=>'<span class="icn">'+sv('check',12,'var(--g)')+' '+x+'</span>').join('<br>')}</p><p class="m" style="font-size:11px">Hash: ${S.hash||'pending'}</p><button class="btn" style="margin-top:10px" onclick="cl()">Close</button></div>`)}

R.hand=()=>{const s=S.step,P=(n,b)=>`<div class="ph ${s===n?'on':''}"><span class="pill Fair" style="align-self:center;font-size:11px">Offline mode</span>${b}</div>`,C=['Item matches listing photos','Condition matches declared grade','All included accessories present','No undisclosed damage observed'];
return`<div class="row" style="border:0;flex-wrap:wrap"><h1>Offline handoff</h1><span class="lk" onclick="go('trades')">Exit prototype</span></div><div style="display:flex;gap:14px;flex-wrap:wrap;justify-content:center;padding:8px">`+
P(1,`<h2 style="text-align:center;font-size:14px">Verify Presence</h2><p class="m" style="text-align:center;font-size:11px">Step 1 of 4</p><div class="code" id="cc">${(GUIDE.stepTp||tp()).split('').join(' ')}</div><p style="text-align:center;font-size:11px">${sv('clock',11)} <span id="cd"></span></p><p class="m" style="font-size:11px">Or enter the code they show you:</p><input id="pc" maxlength="6" inputmode="numeric" style="text-align:center;letter-spacing:4px;font-size:16px" placeholder="______" value="${GUIDE.stepTp||tp()}"><button class="btn bg" id="guide-verify" onclick="v1()" style="width:100%">Verify</button>`)+
P(2,`<h2 style="text-align:center;font-size:14px">Condition Checklist</h2><p class="m" style="text-align:center;font-size:11px">Step 2 of 4</p>${C.map((c,i)=>`<div class="card cd" style="padding:7px;font-size:12px;${S.ch[i]?'border-color:var(--g)':''}" onclick="S.ch[${i}]^=1;render()"><span class="icn">${S.ch[i]?sv('check',13,'var(--g)'):sv('plus',13,'var(--m)')}${c}</span></div>`).join('')}<textarea rows="2" placeholder="Notes / discrepancies (optional)" style="font-size:12px"></textarea><button class="btn bg" id="guide-continue" onclick="cc()" style="width:100%">Continue</button>`)+
P(3,`<p class="m" style="text-align:center;font-size:11px">By signing, you confirm the checklist above.</p><label>Your signature</label><canvas width="180" height="60"></canvas><div class="row" style="border:0"><span class="lk" onclick="clr(0)">Clear</span><button id="btn-sign-0" class="btn bg" onclick="sg(0)">Sign</button></div><label>Partner's signature</label><canvas width="180" height="60"></canvas><div class="row" style="border:0"><span class="lk" onclick="clr(1)">Clear</span><button id="btn-sign-1" class="btn bg" onclick="sg(1)">Sign</button></div><button class="btn bg" id="guide-submit-sig" onclick="sb()" style="width:100%">Submit Signature</button>`)+
P(4,`<h2 style="text-align:center;font-size:14px">Handoff Recorded</h2><p class="m" style="text-align:center;font-size:11px">Step 4 of 4</p><div style="font-size:44px;text-align:center;color:var(--g)">${sv('check',44,'var(--g)')}</div><p style="text-align:center"><span class="pill ${S.synced?'Good':'Fair'}">${S.synced?'Synced':'Pending Sync'}</span></p><p class="m" style="text-align:center;font-size:11px">Hash: ${S.hash.slice(0,4)}…${S.hash.slice(-4)}</p><p class="m" style="text-align:center;font-size:11px">Both signatures bound to trade secret. Reconnect to campus Wi-Fi to sync your signed manifest.</p>${S.synced?'':'<button class="btn bb" id="guide-sync" onclick="sy()" style="width:100%">Reconnect &amp; sync</button>'}<button id="btn-vm" class="btn" onclick="GUIDE.manifestViewed2=true;vm()" style="width:100%">View Signed Manifest</button>`)+`</div>`};

function v1(){const v=($('#pc')||{}).value;if(v&&v.trim().length===6){GUIDE.presenceVerified=true;S.step=2;render()}else T('Enter the 6-digit code shown on the partner device')}
function cc(){if(!S.ch.every(x=>x))return T('Resolve every checklist item first');GUIDE.checklistDone=true;S.step=3;render()}
function sg(k){S.sig[k]=1;T(k?"Partner's signature captured":'Your signature captured');render()}
function clr(k){const c=document.querySelectorAll('canvas')[k];if(c)c.getContext('2d').clearRect(0,0,180,60);S.sig[k]=0}
function sb(){if(!(S.sig[0]&&S.sig[1]))return T('Both parties must sign');S.hash=hx(tp()+Date.now());GUIDE.signedDone=true;S.step=4;render()}
function sy(){T('Syncing signed manifest…');const proceed=()=>{S.synced=1;S.stage='Finalized';S.unlock=false;GUIDE.synced=true;render();T('Synced. Trade finalized.');setTimeout(ev,900)};setTimeout(proceed,700)}
function ev(){const Q=['Functional suitability: The system allowed me to complete the barter as intended.','Usability: The interface was easy to navigate.','Reliability: The offline handoff worked without errors.','Performance efficiency: The pages loaded quickly and responsively.'];MD(`<div class="card" style="width:600px;max-width:94vw"><h1>Trade Evaluation</h1><p class="m" style="margin-bottom:8px;font-size:12px">Help us evaluate the system based on ISO/IEC 25010. Rate all four criteria, then submit.</p>${Q.map((q,i)=>`<div class="row" style="flex-wrap:wrap;font-size:12px"><span style="flex:1;min-width:180px">${q}</span><span class="rt r${i}">${[1,2,3,4,5].map(n=>`<button onclick="rt(${i},${n})">${n}</button>`).join('')}</span></div>`).join('')}<label style="display:block;margin-top:10px">Optional comments</label><textarea rows="2" placeholder="Share your thoughts..."></textarea><div style="text-align:right;margin-top:8px"><button class="btn" onclick="cl()">Cancel</button> <button class="btn bg" onclick="submitEval()">Submit Evaluation</button></div></div>`)}

setInterval(()=>{
  if(MODE!=='guide'||advLock)return;
  const s=DS[di];if(!s||!s.req)return;
  let ok=false;
  try{ok=s.req()}catch(e){ok=false}
  if(!ok)return;
  advLock=true;
  setTimeout(()=>{
    advLock=false;
    if(di<DS.length-1){
      di++;
      render();
      dr();
    }
  },450);
},400);

document.addEventListener('click',e=>{
  if(MODE!=='guide')return;
  if(e.target.closest('#dmo, #md, #ts'))return;
  const s=DS[di];if(!s)return;
  if(s.ok&&e.target.closest(s.ok))return;
  if(['INPUT','TEXTAREA','SELECT'].includes(e.target.tagName)){
    if(e.target.closest(s.ok))return;
  }
  e.stopPropagation();e.preventDefault();
  T('Guide: Please use the highlighted element.');
},true);

function applyGM(){
  if(MODE!=='guide'&&MODE!=='demo'){unhl();return}
  const s=DS[di];
  if(!s||!s.f){unhl();return}
  const el=document.querySelector(s.f);
  if(!el){unhl();return}
  if(el.classList.contains('hl'))return;
  unhl();
  el.classList.add('hl');
  if(di===lastScrolledStep)return;
  lastScrolledStep=di;
  const r=el.getBoundingClientRect();
  const isMobile=window.innerWidth<=640;
  const panelH=isMobile?Math.min(window.innerHeight*0.46,320):100;
  const top=90,bot=window.innerHeight-panelH-30;
  if(r.top<top||r.bottom>bot){
    const y=window.scrollY+r.top-(top+20);
    window.scrollTo({top:Math.max(0,y),behavior:'auto'});
  }
}
function unhl(){document.querySelectorAll('.hl').forEach(e=>e.classList.remove('hl'))}

function toggleAutoPlay() {
  if(window.demoInterval) {
    clearInterval(window.demoInterval);
    window.demoInterval = null;
    T('Auto-play paused');
  } else {
    T('Auto-play started');
    window.demoInterval = setInterval(() => {
      if(di < DS.length - 1) dn(1);
      else toggleAutoPlay();
    }, 2000);
  }
  dr();
}

function setupStep(i){
  const modalSteps = [12, 14, 26, 34];
  if(!modalSteps.includes(i)) cl();

  if(i === 0){
    resetState();
    S.r = 'reg';
  } else if(i === 1){
    S.r = 'reg'; S.role = 's'; S.idFile = 'ID_Card_DelaCruz.jpg'; GUIDE.idUploaded = true;
  } else if(i === 2){
    S.r = 'reg'; S.role = 's'; S.verified = true; S.registered = true;
  } else if(i >= 3 && i <= 10){
    S.r = 'browse'; S.role = 's'; S.registered = true; S.verified = true;
    if(i === 3) S.cat = 'All';
    else if(i === 4) S.cat = 'PC Components';
    else if(i === 5) S.cat = 'Storage & Memory';
    else if(i === 6) S.cat = 'Peripherals & Audio';
    else if(i === 7) S.cat = 'Embedded/IoT Kits';
    else if(i >= 8) S.cat = 'All';
    if(i >= 9) S.sel = 0;
  } else if(i >= 11 && i <= 19){
    S.r = 'prop'; S.role = 's'; S.registered = true;
    if(i === 11){ S.of = []; S.rq = [IT[0][0]]; S.tl = []; }
    else if(i === 12){ S.of = []; S.rq = [IT[0][0]]; ai('of'); }
    else if(i === 13){ S.of = [MY[0][0]]; S.rq = [IT[0][0]]; cl(); }
    else if(i === 14){ S.of = [MY[0][0]]; S.rq = [IT[0][0]]; ai('rq'); }
    else if(i >= 15 && i <= 16){ S.of = [MY[0][0]]; S.rq = [IT[0][0], IT[1][0]]; cl(); }
    if(i >= 17 && !S.tl.length) S.tl = [['Initial Proposal', S.of.join(' + ')||MY[0][0], S.rq.join(' + ')||IT[0][0], 'Sample note']];
    if(i >= 18 && S.tl.length < 2) S.tl.push(['Counter-Proposal', S.of.join(' + ')||MY[0][0], S.rq.join(' + ')||IT[0][0], 'Counter terms']);
    if(i >= 19){ S.stage = 'Accepted'; S.unlock = true; }
  } else if(i >= 20 && i <= 21){
    S.r = 'trades'; S.role = 's'; S.registered = true; S.stage = 'Accepted'; S.unlock = true;
    if(!S.of.length) S.of = [MY[0][0]];
    if(!S.rq.length) S.rq = [IT[0][0]];
    cl();
  } else if(i >= 22 && i <= 24){
    S.r = 'meet'; S.role = 's'; S.registered = true;
    if(i === 24) S.stage = 'Scheduled'; else S.stage = 'Accepted';
    S.unlock = true;
    cl();
  } else if(i >= 25 && i <= 26){
    S.r = 'trades'; S.role = 's'; S.registered = true; S.stage = 'Scheduled';
    if(i === 26) prep(); else cl();
  } else if(i >= 27 && i <= 35){
    S.r = 'hand'; S.role = 's'; S.registered = true;
    if(i === 27){ S.step = 1; cl(); }
    else if(i === 28){ S.step = 2; S.ch = [0,0,0,0]; cl(); }
    else if(i === 29){ S.step = 2; S.ch = [1,1,1,1]; cl(); }
    else if(i === 30){ S.step = 3; S.sig = [0,0]; cl(); }
    else if(i === 31){ S.step = 3; S.sig = [1,0]; cl(); }
    else if(i === 32){ S.step = 3; S.sig = [1,1]; cl(); }
    else if(i === 33){ S.step = 4; S.synced = 0; S.hash = hx(tp()+Date.now()); cl(); }
    else if(i === 34){ S.step = 4; S.synced = 1; S.stage = 'Finalized'; ev(); }
    else if(i === 35){ S.step = 4; S.synced = 1; S.stage = 'Finalized'; GUIDE.evaluated = true; cl(); }
  } else if(i === 36){
    S.r = 'hand'; S.role = 's'; S.registered = true; cl();
  } else if(i === 37){
    S.r = 'admin'; S.role = 'a'; S.registered = true; cl();
  } else if(i >= 38 && i <= 39){
    S.r = 'disp'; S.role = 'a'; S.registered = true; S.did = 0; cl();
  } else if(i >= 40 && i <= 41){
    S.r = 'audit'; S.role = 'a'; S.registered = true; cl();
  } else if(i >= 42 && i <= 43){
    S.r = 'appeal'; S.role = 'a'; S.registered = true; cl();
  } else {
    cl();
  }
}

function dm(m){
  if(window.demoInterval){ clearInterval(window.demoInterval); window.demoInterval=null; }
  MODE=m;di=-1;advLock=false;lastScrolledStep=-1;
  if(m==='guide')resetGuide();
  else resetState();
  if(!$('#dmo')){
    const e=document.createElement('div');e.id='dmo';document.body.append(e);
    let ox,oy,d=0;
    e.onpointerdown=v=>{if(v.target.closest('.dh')&&!v.target.closest('.dhicons span')){d=1;ox=v.clientX-e.offsetLeft;oy=v.clientY-e.offsetTop;e.setPointerCapture(v.pointerId)}};
    e.onpointermove=v=>{if(d){e.style.left=v.clientX-ox+'px';e.style.top=v.clientY-oy+'px';e.style.right='auto';e.style.bottom='auto'}};
    e.onpointerup=()=>d=0;
  }
  dn(1);
}

function dn(n){
  if(n===-99){

    resetGuide();

  } else {
    di = Math.max(0, Math.min(DS.length - 1, di + n));
    if(MODE==='demo') {

    }
  }

}

  $('#dmo').className=MODE==='guide'?'guide':'';
